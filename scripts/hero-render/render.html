<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script>

<script type="module">
import * as THREE from "three";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

const P = new URLSearchParams(location.search);
const W = +(P.get("w") || 2560), H = +(P.get("h") || 1440);
const CAM = (P.get("cam") || "wide");

// ---------- deterministic random ----------
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const rr = (a, b) => a + (b - a) * rnd();

// ---------- coastline: signed distance (land > 0, sea < 0) ----------
// The shore runs diagonally: sea on the left and in front, land on the right and behind.
const shore = (x, z) => (x - 0.55 * z) - 10 + 9 * Math.sin(z / 38) + 5 * Math.sin(z / 13 + 1.7) + 0.0009 * (z + 40) * (z + 40) * 0.0;
const hash = (x, z) => { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); };
function vnoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash(xi, zi), b = hash(xi + 1, zi), c = hash(xi, zi + 1), d = hash(xi + 1, zi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const fbm = (x, z) => { let s = 0, a = 0.5, f = 1; for (let i = 0; i < 5; i++) { s += a * vnoise(x * f, z * f); f *= 2.03; a *= 0.5; } return s; };

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const HAZE = new THREE.Color("#efc29a");
scene.fog = new THREE.FogExp2(HAZE, +(P.get("fog") || 0.0011));

// Sun: low, from the left and behind (golden hour), so the sea carries a long glint toward the camera.
// The light comes from the left (warm on the villa's front); the sun disc and its glint on the sea sit low in the
// sky, top left of the frame (an art-directed golden hour, as architectural renders do).
const sunDir = new THREE.Vector3(-0.85, 0.24, -0.3).normalize();
const skySun = new THREE.Vector3(+(P.get("sx") || -0.42), +(P.get("sy") || 0.07), +(P.get("sz") || -0.9)).normalize();

// ---------- sky ----------
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { sun: { value: skySun } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    varying vec3 vDir; uniform vec3 sun;
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    float n(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
      return mix(mix(h(i),h(i+vec2(1,0)),f.x), mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x), f.y); }
    float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<6;i++){ s+=a*n(p); p*=2.02; a*=.5; } return s; }
    void main(){
      vec3 d = normalize(vDir);
      float y = max(d.y, 0.0);
      vec3 horizon = vec3(1.00, 0.66, 0.40);
      vec3 low = vec3(0.99, 0.78, 0.58);
      vec3 mid = vec3(0.88, 0.82, 0.76);
      vec3 top = vec3(0.50, 0.63, 0.76);
      vec3 col = mix(horizon, low, smoothstep(0.0, 0.06, y));
      col = mix(col, mid, smoothstep(0.05, 0.22, y));
      col = mix(col, top, smoothstep(0.2, 0.7, y));
      float s = max(dot(d, sun), 0.0);
      col += vec3(1.0, 0.62, 0.30) * pow(s, 8.0) * 0.55;
      col += vec3(1.0, 0.80, 0.55) * pow(s, 64.0) * 0.9;
      col += vec3(1.0, 0.95, 0.85) * smoothstep(0.9993, 0.9998, s) * 3.0;
      // thin warm clouds, stretched along the horizon
      vec2 cp = d.xz / (d.y + 0.12) * vec2(1.2, 3.2);
      float c = smoothstep(0.55, 0.85, fbm(cp * 0.9 + vec2(3.0, 1.0)));
      vec3 cc = mix(vec3(1.0, 0.86, 0.72), vec3(1.0, 0.70, 0.48), pow(s, 3.0));
      col = mix(col, cc, c * 0.55 * smoothstep(0.01, 0.12, y) * (1.0 - smoothstep(0.35, 0.6, y)));
      gl_FragColor = vec4(col * 0.78, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(4000, 64, 32), skyMat));
{ // the sky lights and reflects in every material (glass mirrors the sunset)
  const envScene = new THREE.Scene();
  envScene.add(new THREE.Mesh(new THREE.SphereGeometry(100, 48, 24), skyMat));
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(envScene, 0.02).texture;
  scene.environmentIntensity = 0.38;
}

// ---------- light ----------
const sunLight = new THREE.DirectionalLight(new THREE.Color("#ffd3a6"), 3.0);
sunLight.position.copy(sunDir).multiplyScalar(400);
sunLight.target.position.set(0, 0, -40);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(4096, 4096);
const sc = sunLight.shadow.camera; sc.left = -140; sc.right = 140; sc.top = 140; sc.bottom = -140; sc.near = 50; sc.far = 900;
sunLight.shadow.bias = -0.0004; sunLight.shadow.normalBias = 0.6;
scene.add(sunLight, sunLight.target);
scene.add(new THREE.HemisphereLight(new THREE.Color("#e9eef2"), new THREE.Color("#4a5a44"), 1.0));

// ---------- sea ----------
const seaMat = new THREE.ShaderMaterial({
  fog: true,
  uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, { sun: { value: skySun }, camPos: { value: new THREE.Vector3() } }]),
  vertexShader: `varying vec3 vW;
    #include <fog_pars_vertex>
    void main(){ vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz; vec4 mvPosition = viewMatrix * w; gl_Position = projectionMatrix * mvPosition;
    #include <fog_vertex>
    }`,
  fragmentShader: `
    uniform vec3 sun; uniform vec3 camPos; varying vec3 vW;
    #include <fog_pars_fragment>
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    float n(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
      return mix(mix(h(i),h(i+vec2(1,0)),f.x), mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x), f.y); }
    float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<5;i++){ s+=a*n(p); p*=2.03; a*=.5; } return s; }
    float shore(vec2 p){ return (p.x - 0.55*p.y) - 10.0 + 9.0*sin(p.y/38.0) + 5.0*sin(p.y/13.0+1.7); }
    void main(){
      vec2 p = vW.xz;
      float d = -shore(p);                       // distance out to sea (m)
      // waves: small normal perturbation from two fbm layers
      float e = 0.35;
      float hC = fbm(p*0.22) + 0.5*fbm(p*0.9 + 7.0);
      float hX = fbm((p+vec2(e,0.))*0.22) + 0.5*fbm((p+vec2(e,0.))*0.9 + 7.0);
      float hZ = fbm((p+vec2(0.,e))*0.22) + 0.5*fbm((p+vec2(0.,e))*0.9 + 7.0);
      vec3 N = normalize(vec3(-(hX-hC)*1.6, 1.0, -(hZ-hC)*1.6));
      vec3 V = normalize(camPos - vW);
      // water colour by depth: lagoon turquoise at the beach, teal, then deep blue
      vec3 shallow = vec3(0.30, 0.84, 0.78);
      vec3 lagoon = vec3(0.05, 0.56, 0.60);
      vec3 deep = vec3(0.02, 0.22, 0.32);
      vec3 col = mix(shallow, lagoon, smoothstep(2.0, 26.0, d));
      col = mix(col, deep, smoothstep(25.0, 110.0, d));
      // reef and seagrass patches in the lagoon
      float reef = smoothstep(0.58, 0.72, fbm(p*0.05 + 3.1)) * smoothstep(8.0, 22.0, d) * (1.0 - smoothstep(60.0, 90.0, d));
      col = mix(col, vec3(0.07, 0.30, 0.30), reef * 0.75);
      // sandy bottom visible right at the waterline + foam line
      col = mix(vec3(0.80, 0.85, 0.72), col, smoothstep(0.0, 3.5, d));
      float foam = (1.0 - smoothstep(0.0, 1.4, d)) * (0.55 + 0.45*n(p*1.7));
      col = mix(col, vec3(1.0, 0.97, 0.92), foam * 0.85);
      // light: diffuse warm sun + sky fresnel + sun glint
      float diff = 0.55 + 0.45 * max(dot(N, sun), 0.0);
      col *= diff * vec3(1.0, 0.93, 0.86);
      float fres = pow(1.0 - max(dot(N, V), 0.0), 4.0);
      vec3 skyRef = mix(vec3(0.98, 0.78, 0.60), vec3(0.72, 0.78, 0.84), clamp(reflect(-V, N).y * 2.0, 0.0, 1.0));
      col = mix(col, skyRef, clamp(fres * 0.85 + smoothstep(120.0, 600.0, length(camPos.xz - p)) * 0.35, 0.0, 0.85));
      vec3 R = reflect(-sun, N);
      float g = pow(max(dot(R, V), 0.0), 220.0);
      col += vec3(1.0, 0.82, 0.55) * g * 1.4;
      col += vec3(1.0, 0.70, 0.42) * pow(max(dot(R, V), 0.0), 14.0) * 0.32;
      col += vec3(1.0, 0.86, 0.6) * pow(max(dot(R, V), 0.0), 900.0) * 2.0 * step(0.7, n(p*3.0));
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
      #include <fog_fragment>
    }`,
});
const sea = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000, 1, 1).rotateX(-Math.PI / 2), seaMat);
sea.receiveShadow = false;
scene.add(sea);

// ---------- land (beach + vegetation hills) ----------
{
  const g = new THREE.PlaneGeometry(640, 640, 640, 640).rotateX(-Math.PI / 2);
  g.translate(160, 0, -120);
  const pos = g.attributes.position, colors = [];
  const sand = new THREE.Color("#f3e4c8"), wet = new THREE.Color("#d6c29c"), dune = new THREE.Color("#ead6b0");
  const g1 = new THREE.Color("#2a4624"), g2 = new THREE.Color("#3b6130"), g3 = new THREE.Color("#5a7a3a");
  const c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i), d = shore(x, z);
    let y;
    if (d < 0) y = 0.15 + d * 0.3;
    else if (d < 16) y = 0.15 + d * 0.06;
    else y = 1.1 + Math.min(1, (d - 16) / 25) * (2 + 6 * fbm(x * 0.02, z * 0.02)) + 0.6 * fbm(x * 0.2, z * 0.2);
    pos.setY(i, y);
    if (d < 2.2) c.copy(wet).lerp(sand, Math.max(0, d / 2.2));
    else if (d < 15) c.copy(sand).lerp(dune, fbm(x * 0.15, z * 0.15) * 0.7);
    else if (d < 19) c.copy(dune).lerp(g3, (d - 15) / 4);
    else { const t = fbm(x * 0.05, z * 0.05); c.copy(g1).lerp(g2, t).lerp(g3, Math.max(0, fbm(x * 0.3, z * 0.3) - 0.55)); }
    colors.push(c.r, c.g, c.b);
  }
  g.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
  g.computeVertexNormals();
  const land = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95 }));
  land.receiveShadow = true;
  scene.add(land);
}
const groundY = (x, z) => { const d = shore(x, z); return d < 16 ? 0.15 + Math.max(0, d) * 0.06 : 1.1 + Math.min(1, (d - 16) / 25) * (2 + 6 * fbm(x * 0.02, z * 0.02)) + 0.6 * fbm(x * 0.2, z * 0.2); };

// ---------- distant islands on the horizon ----------
for (const [x, z, sx, sz, hgt] of [[-700, -1900, 420, 60, 9], [300, -2300, 600, 80, 12], [-1500, -2100, 260, 40, 6]]) {
  const geo = new THREE.SphereGeometry(1, 48, 16, 0, Math.PI * 2, 0, Math.PI / 2);
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: "#4e6448", roughness: 1 }));
  m.scale.set(sx, hgt, sz); m.position.set(x, -1, z); scene.add(m);
}

// ---------- villa site (on the vegetation edge, facing the sea) ----------
// find a point where the shore distance is ~24 m along z = -40
const site = (() => { const z = -38; let x = -60; while (shore(x, z) < 26) x += 0.25; return new THREE.Vector3(x, 0, z); })();
const base = groundY(site.x, site.z) + 0.2;
// faces the sea: the shore normal points toward -x / +z roughly
const facing = Math.atan2(-1, 0.55) + Math.PI / 2; // rotation about y so the villa's front (+z local) looks at the water

const villa = new THREE.Group();
villa.position.set(site.x, base, site.z);
sunLight.target.position.copy(site);
villa.rotation.y = facing;
villa.scale.setScalar(+(P.get("vs") || 1.3));
scene.add(villa);
const white = new THREE.MeshStandardMaterial({ color: "#ffffff", roughness: 0.5 });
const stone = new THREE.MeshStandardMaterial({ color: "#e6ddcf", roughness: 0.85 });
const wood = new THREE.MeshStandardMaterial({ color: "#9a7a5c", roughness: 0.75 });
const glass = new THREE.MeshStandardMaterial({ color: "#5b6e74", roughness: 0.04, metalness: 0.95, emissive: new THREE.Color("#ffc58e"), emissiveIntensity: 0.12, envMapIntensity: 1.6 });
const glassDark = new THREE.MeshStandardMaterial({ color: "#4a5c63", roughness: 0.03, metalness: 0.95, emissiveIntensity: 0, envMapIntensity: 1.6 });
const pool = new THREE.MeshStandardMaterial({ color: "#2fc4cc", roughness: 0.03, metalness: 0.3, emissive: new THREE.Color("#1aa6b4"), emissiveIntensity: 0.25, envMapIntensity: 1.2 });
const box = (w, h, d, mat, x, y, z, parent = villa) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y + h / 2, z); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m; };
// terrace platform and deck
box(46, 0.8, 34, stone, 0, -0.6, 2);
box(30, 0.25, 10, wood, -4, 0.2, 18);
// infinity pool toward the sea
box(22, 0.35, 7, pool, 2, 0.05, 13);
box(23, 0.3, 0.6, white, 2, 0.05, 16.8);
// ground floor: recessed glass box with warm light inside
box(28, 4.2, 12, glass, 0, 0.2, -2);
// ground floor side walls
box(1, 4.2, 13, white, -14.5, 0.2, -2); box(1, 4.2, 13, white, 14.5, 0.2, -2);
// first-floor slab (cantilevered toward the sea)
box(36, 0.7, 19, white, 1, 4.4, 0.5);
// upper floor glass + solid volume
box(22, 3.8, 11, glassDark, -3, 5.1, -1.5);
box(9, 3.8, 11, white, 12.5, 5.1, -1.5);
// roof slab with deep overhang
box(32, 0.6, 17, white, 0, 8.9, 0);
// mullions on the glass fronts and a glass balustrade on the first floor
const mull = new THREE.MeshStandardMaterial({ color: "#e9e6e0", roughness: 0.4 });
for (let x = -13; x <= 13; x += 3.25) box(0.18, 4.2, 0.2, mull, x, 0.2, 4.05);
for (let x = -13.5; x <= 7.5; x += 3) box(0.16, 3.8, 0.2, mull, x, 5.1, 4.05);
box(34, 1.0, 0.12, new THREE.MeshStandardMaterial({ color: "#9fb3b6", roughness: 0.05, metalness: 0.5, transparent: true, opacity: 0.45 }), 1, 5.1, 9.9);
// slim columns
for (const x of [-16, -6, 6, 16]) box(0.45, 4.2, 0.45, white, x, 0.2, 9.4);
// second small pavilion
box(10, 3.4, 8, glassDark, -24, 0.2, -6); box(0.6, 3.4, 8, white, -29, 0.2, -6); box(12, 0.5, 10, white, -24, 3.6, -6);
// deck loungers and umbrellas
for (let i = 0; i < 4; i++) { box(1.2, 0.35, 2.6, white, -12 + i * 2.2, 0.45, 19.5); }
const umb = new THREE.MeshStandardMaterial({ color: "#efe6d6", roughness: 0.8 });
for (const x of [-15, -4]) { const c = new THREE.Mesh(new THREE.ConeGeometry(2.4, 0.9, 16), umb); c.position.set(x, 3.0, 21); c.castShadow = true; villa.add(c); box(0.12, 2.6, 0.12, wood, x, 0.3, 21); }

// ---------- pier and yacht ----------
const pier = new THREE.Group(); scene.add(pier);
{
  // from the beach in front of the villa, straight out to sea
  const start = new THREE.Vector3(site.x - 26, 0, site.z + 14);
  const dir = new THREE.Vector3(-0.88, 0, 0.47).normalize();
  const len = 44;
  const ang = Math.atan2(dir.x, dir.z);
  const deck = new THREE.Mesh(new THREE.BoxGeometry(4, 0.35, len), wood);
  deck.position.copy(start).addScaledVector(dir, len / 2); deck.position.y = 1.0; deck.rotation.y = ang; deck.castShadow = true; deck.receiveShadow = true; pier.add(deck);
  for (let i = 0; i <= 10; i++) for (const s of [-1.8, 1.8]) {
    const p = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 2.6, 8), wood);
    const side = new THREE.Vector3(dir.z, 0, -dir.x).multiplyScalar(s);
    p.position.copy(start).addScaledVector(dir, i * len / 10).add(side); p.position.y = 0; p.castShadow = true; pier.add(p);
  }
  // yacht moored along the pier's far end
  const yacht = new THREE.Group();
  const hullShape = new THREE.Shape();
  hullShape.moveTo(-9, -2.2); hullShape.lineTo(7, -2.2); hullShape.quadraticCurveTo(11.5, -1.6, 12.5, 0); hullShape.quadraticCurveTo(11, 2.2, 7, 2.3); hullShape.lineTo(-9, 2.3); hullShape.lineTo(-9, -2.2);
  const hull = new THREE.Mesh(new THREE.ExtrudeGeometry(hullShape, { depth: 2.2, bevelEnabled: true, bevelSize: 0.5, bevelThickness: 0.5, bevelSegments: 3 }), new THREE.MeshStandardMaterial({ color: "#f7f6f2", roughness: 0.3 }));
  hull.rotation.x = -Math.PI / 2; hull.position.y = -0.4; hull.castShadow = true; yacht.add(hull);
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(18, 0.35, 4.9), new THREE.MeshStandardMaterial({ color: "#26343c", roughness: 0.2, metalness: 0.4 }));
  stripe.position.set(-0.5, 1.2, 0); yacht.add(stripe);
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(10, 1.8, 3.6), new THREE.MeshStandardMaterial({ color: "#f4f3ef", roughness: 0.35 }));
  cabin.position.set(-1.5, 2.6, 0); cabin.castShadow = true; yacht.add(cabin);
  const win = new THREE.Mesh(new THREE.BoxGeometry(8.6, 0.9, 3.7), new THREE.MeshStandardMaterial({ color: "#1a252c", roughness: 0.05, metalness: 0.8 }));
  win.position.set(-1.2, 2.7, 0); yacht.add(win);
  const fly = new THREE.Mesh(new THREE.BoxGeometry(6, 0.3, 3.4), new THREE.MeshStandardMaterial({ color: "#f4f3ef", roughness: 0.35 }));
  fly.position.set(-2.5, 3.7, 0); fly.castShadow = true; yacht.add(fly);
  const end = start.clone().addScaledVector(dir, len - 9);
  const side = new THREE.Vector3(dir.z, 0, -dir.x).multiplyScalar(-5.2);
  yacht.position.copy(end).add(side); yacht.position.y = 0.2;
  yacht.rotation.y = ang - Math.PI / 2;
  scene.add(yacht);
}

// ---------- palms ----------
function palmGeometry() {
  const parts = [];
  const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0.6, 4, 0), new THREE.Vector3(1.6, 8, 0), new THREE.Vector3(3.0, 11.5, 0)]);
  const trunk = new THREE.TubeGeometry(curve, 14, 0.26, 7, false);
  const tc = new THREE.Color("#8b7656"); const tcol = []; for (let i = 0; i < trunk.attributes.position.count; i++) tcol.push(tc.r, tc.g, tc.b);
  trunk.setAttribute("color", new THREE.Float32BufferAttribute(tcol, 3));
  parts.push(trunk);
  const top = curve.getPoint(1);
  const fc = new THREE.Color("#3e6a2c"), fc2 = new THREE.Color("#6b8f3c");
  for (let k = 0; k < 16; k++) {
    const a = (k / 16) * Math.PI * 2 + k * 0.37;
    // a frond: a thin leaf strip bent downward
    const L = 5.5 + (k % 3) * 0.8;
    const pts = []; for (let s = 0; s <= 8; s++) { const t = s / 8; pts.push(new THREE.Vector3(Math.cos(a) * L * t, 0.9 * Math.sin(t * Math.PI * 0.8) - 2.6 * t * t, Math.sin(a) * L * t)); }
    const fcurve = new THREE.CatmullRomCurve3(pts);
    const leaf = new THREE.TubeGeometry(fcurve, 12, 0.42, 3, false);
    leaf.scale(1, 0.18, 1);
    leaf.translate(top.x, top.y, top.z);
    const c = fc.clone().lerp(fc2, (k % 4) / 4); const lc = []; for (let i = 0; i < leaf.attributes.position.count; i++) lc.push(c.r, c.g, c.b);
    leaf.setAttribute("color", new THREE.Float32BufferAttribute(lc, 3));
    parts.push(leaf);
  }
  for (const p of parts) { p.deleteAttribute("uv"); }
  return mergeGeometries(parts.map((g) => g.toNonIndexed ? g.toNonIndexed() : g));
}
{
  const geo = palmGeometry(); geo.computeVertexNormals();
  const N = 520;
  const mesh = new THREE.InstancedMesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.85, side: THREE.DoubleSide }), N);
  mesh.castShadow = true; mesh.receiveShadow = true;
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  let n = 0, guard = 0;
  while (n < N && guard++ < 20000) {
    const x = rr(-120, 420), z = rr(-420, 120), d = shore(x, z);
    if (d < 13 || d > 260) continue;
    if (Math.hypot(x - site.x, z - site.z) < 30) continue; // keep the villa clear
    if (d > 40 && rnd() < 0.55) continue; // denser near the beach
    const s = rr(0.85, 1.35) * (d < 22 ? 1.1 : 1);
    e.set(rr(-0.08, 0.08), rr(0, Math.PI * 2), rr(-0.08, 0.08)); q.setFromEuler(e);
    m.compose(new THREE.Vector3(x, groundY(x, z) - 0.2, z), q, new THREE.Vector3(s, s, s));
    mesh.setMatrixAt(n++, m);
  }
  mesh.count = n; scene.add(mesh);
}
// ---------- dense canopy (bushes and tree crowns) ----------
{
  const geo = new THREE.IcosahedronGeometry(1, 1);
  const p = geo.attributes.position; for (let i = 0; i < p.count; i++) { const k = 0.8 + 0.4 * hash(p.getX(i) * 3.1, p.getZ(i) * 5.3 + p.getY(i)); p.setXYZ(i, p.getX(i) * k, p.getY(i) * k * 0.8, p.getZ(i) * k); }
  geo.computeVertexNormals();
  const N = 6000;
  const mesh = new THREE.InstancedMesh(geo, new THREE.MeshStandardMaterial({ roughness: 0.95 }), N);
  mesh.castShadow = true; mesh.receiveShadow = true;
  const m = new THREE.Matrix4(), col = new THREE.Color();
  const pal = ["#2b4826", "#34542c", "#3f6232", "#4b6e38", "#587a3e"];
  let n = 0, guard = 0;
  while (n < N && guard++ < 60000) {
    const x = rr(-120, 460), z = rr(-460, 140), d = shore(x, z);
    if (d < 18 || d > 320) continue;
    if (Math.hypot(x - site.x, z - site.z) < 27) continue;
    const s = rr(1.2, 3.2) * (d > 40 ? 1.25 : 0.85);
    m.compose(new THREE.Vector3(x, groundY(x, z) + s * 0.35, z), new THREE.Quaternion(), new THREE.Vector3(s, s * rr(0.7, 1.1), s));
    mesh.setMatrixAt(n, m); mesh.setColorAt(n, col.set(pal[Math.floor(rnd() * pal.length)])); n++;
  }
  mesh.count = n; scene.add(mesh);
}
// ---------- rocks at the shore ----------
{
  const geo = new THREE.DodecahedronGeometry(1, 0);
  const mat = new THREE.MeshStandardMaterial({ color: "#8d867c", roughness: 1, flatShading: true });
  for (let i = 0; i < 10; i++) {
    const z = rr(-200, 60); let x = -60; while (shore(x, z) < -rr(0, 6)) x += 0.5;
    const r = new THREE.Mesh(geo, mat); const s = rr(0.6, 2.4);
    r.scale.set(s * rr(1, 1.8), s * 0.6, s); r.position.set(x + rr(-3, 2), 0.1, z); r.rotation.y = rr(0, 6); r.castShadow = true; scene.add(r);
  }
}

// ---------- camera ----------
const num = (k, d) => +(P.get(k) ?? d);
const cam = new THREE.PerspectiveCamera(num("fov", 38), W / H, 1, 9000);
cam.position.set(site.x + num("cx", -70), num("cy", 48), site.z + num("cz", 105));
cam.lookAt(site.x + num("tx", -45), num("ty", 0), site.z + num("tz", -70));
seaMat.uniforms.camPos.value.copy(cam.position);
renderer.render(scene, cam);
window.__done = true;
